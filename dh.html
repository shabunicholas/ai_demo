<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>AI 对话</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
            background: #fafafa;
        }
        #chat {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 16px;
            height: 400px;
            overflow-y: auto;
            background: white;
            margin-bottom: 12px;
        }
        .msg { margin: 8px 0; line-height: 1.6; }
        .user { color: #1a73e8; font-weight: bold; }
        .ai { color: #333; }
        .ai .name { color: #e91e63; font-weight: bold; }
        #input-bar {
            display: flex;
            gap: 8px;
        }
        #question {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        button {
            padding: 10px 24px;
            font-size: 16px;
            background: #e91e63;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover { background: #c2185b; }
    </style>
</head>
<body>
    <h1>🌸 樱瞳 · AI 对话</h1>
    <div id="chat"></div>
    <div id="input-bar">
        <input id="question" placeholder="输入你的问题..." autocomplete="off">
        <button onclick="ask()">发送</button>
    </div>

    <script>
        // 注意：后端字段名是 q
        async function ask() {
            const input = document.getElementById('question');
            const q = input.value.trim();
            if (!q) return;

            const chatBox = document.getElementById('chat');

            // 1. 显示用户消息
            const userMsg = document.createElement('div');
            userMsg.className = 'msg user';
            userMsg.textContent = '你：' + q;
            chatBox.appendChild(userMsg);

            // 2. 先创建一个空的 AI 消息容器
            const aiMsg = document.createElement('div');
            aiMsg.className = 'msg ai';
            aiMsg.innerHTML = '<span class="name">AI：</span><span class="content"></span>';
            chatBox.appendChild(aiMsg);
            const contentSpan = aiMsg.querySelector('.content');

            // 3. 清空输入框，滚动到底部
            input.value = '';
            chatBox.scrollTop = chatBox.scrollHeight;

            // 4. 发送请求，流式读取
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ q: q })   // 注意字段名是 q
                });

                if (!res.ok) {
                    contentSpan.textContent = '请求失败：' + res.status;
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    contentSpan.textContent += decoder.decode(value, { stream: true });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            } catch (err) {
                contentSpan.textContent = '出错：' + err.message;
            }
        }
    </script>
</body>
</html>
